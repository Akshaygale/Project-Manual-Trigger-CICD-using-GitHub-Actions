name: CI/CD Pipeline

# Trigger workflow manually or on push to main
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repo
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Read version from VERSION file
    - name: Set Version
      run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

    # Step 3: Login to DockerHub
    - name: DockerHub Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # Step 4: Build Docker image and push to DockerHub
    - name: Build & Push Docker Image
      run: |
        echo "Building Docker image for version $VERSION"
        docker build -t ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION .
        docker push ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION

    # Step 5: Deploy Docker container to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        VERSION: ${{ env.VERSION }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          echo "Deploying version $VERSION on EC2"
          docker pull ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION
          docker stop demo || true
          docker rm demo || true
          docker run -d -p 5000:5000 --name demo ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION
