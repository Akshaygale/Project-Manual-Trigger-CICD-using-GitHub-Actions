name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout
      uses: actions/checkout@v4

    # Step 2: Read version from VERSION file
    - name: Read version
      run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

    # Step 3: Login to Docker Hub
    - name: Login DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # Step 4: Build and push Docker image
    - name: Build & Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/demoapp:${{ env.VERSION }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/demoapp:${{ env.VERSION }}

    # Step 5: Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          VERSION=${{ env.VERSION }}
          echo "Deploying version $VERSION on EC2"
          docker pull ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION
          docker stop demo || true
          docker rm demo || true
          docker run -d -p 5000:5000 --name demo ${{ secrets.DOCKER_USERNAME }}/demoapp:$VERSION

