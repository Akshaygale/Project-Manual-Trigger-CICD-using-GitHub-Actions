name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read version
      run: echo "version=$(cat version)" >> $GITHUB_ENV

    - name: Login DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build & Push
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/demoapp:${{ env.version }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/demoapp:${{ env.version }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      env:
        VERSION: ${{ env.version }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/demoapp:$version
          docker stop demo || true
          docker rm demo || true
          docker run -d -p 5000:5000 --name demo ${{ secrets.DOCKER_USERNAME }}/demoapp:$version
